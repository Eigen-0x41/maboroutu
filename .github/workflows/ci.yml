name: maboroutu CI

# 本体の変更を、テストリポジトリ（Eigen-0x41/maboroutu-tests）の
# 検証ワークフローで検証する。テストリポジトリ側のimplワークフローを
# 呼び出し、検証対象のライブラリとして本リポジトリの該当コミットを指定する。
#
# NOTE: 呼び出し先は @main 固定のため、テストリポジトリ側の変更を先に
#       mainへ反映してから、本ワークフローを有効にすること。
# NOTE: pull_request では head.sha を指定する。フォークからのPRでは、
#       そのコミットがこのリポジトリから取得できないため失敗する。

on:
   push:
      branches: [main]
   pull_request:
      branches: [main]
   workflow_dispatch:
      inputs:
         analysis:
            description: "Run the optional code analysis jobs (msvc-analyze, clang-lifetime)"
            required: false
            type: boolean
            default: false

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

permissions:
   contents: read

jobs:
   clang:
      strategy:
         fail-fast: false
         matrix:
            project_directory: [".", "error/abort", "error/terminate", "error/throw"]
      uses: Eigen-0x41/maboroutu-tests/.github/workflows/impl_clang.yml@main
      with:
         compiler: clang
         project_directory: ${{ matrix.project_directory }}
         build_type: Both
         library_repository: https://github.com/${{ github.repository }}.git
         library_ref: ${{ github.event.pull_request.head.sha || github.sha }}
         tests_repository: Eigen-0x41/maboroutu-tests
         tests_ref: main

   msvc:
      strategy:
         fail-fast: false
         matrix:
            project_directory: [".", "error/abort", "error/terminate", "error/throw"]
      uses: Eigen-0x41/maboroutu-tests/.github/workflows/impl_msvc.yml@main
      with:
         compiler: msvc
         project_directory: ${{ matrix.project_directory }}
         build_type: Both
         library_repository: https://github.com/${{ github.repository }}.git
         library_ref: ${{ github.event.pull_request.head.sha || github.sha }}
         tests_repository: Eigen-0x41/maboroutu-tests
         tests_ref: main

   # サニタイザ（ASan + UBSan）。他のジョブとは別のチェックとして表示される。
   sanitizer:
      uses: Eigen-0x41/maboroutu-tests/.github/workflows/impl_sanitizer.yml@main
      with:
         library_repository: https://github.com/${{ github.repository }}.git
         library_ref: ${{ github.event.pull_request.head.sha || github.sha }}
         tests_repository: Eigen-0x41/maboroutu-tests
         tests_ref: main

   # MSVC のコード解析（/analyze と C++ Core Check）。手動実行（workflow_dispatch）で
   # analysis を有効にした場合のみ実行する。
   msvc-analyze:
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.analysis }}
      uses: Eigen-0x41/maboroutu-tests/.github/workflows/impl_msvc_analyze.yml@main
      with:
         library_repository: https://github.com/${{ github.repository }}.git
         library_ref: ${{ github.event.pull_request.head.sha || github.sha }}
         tests_repository: Eigen-0x41/maboroutu-tests
         tests_ref: main

   # Clang のライフタイム解析（-Wlifetime-safety-permissive）。手動実行
   # （workflow_dispatch）で analysis を有効にした場合のみ実行する。
   clang-lifetime:
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.analysis }}
      uses: Eigen-0x41/maboroutu-tests/.github/workflows/impl_clang_lifetime.yml@main
      with:
         library_repository: https://github.com/${{ github.repository }}.git
         library_ref: ${{ github.event.pull_request.head.sha || github.sha }}
         tests_repository: Eigen-0x41/maboroutu-tests
         tests_ref: main

   # 静的解析（clang-tidy）。他のジョブとは別のチェックとして表示される。
   # 設定は .github/clang-tidy-ci.yml（誤動作・未定義動作・性能に直結する分類のみ）。
   # 開発環境向けの広範な設定（.clang-tidy）とは別で、検出は合否に影響する。
   clang-tidy:
      runs-on: ubuntu-24.04
      steps:
         - uses: actions/checkout@v4

         - name: Install Clang 18 + clang-tidy + libc++ + Ninja
           run: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                clang-18 clang-tidy-18 libc++-18-dev libc++abi-18-dev ninja-build

         - name: Configure and build (generates module interfaces)
           run: |
              cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang-18 \
                -DCMAKE_CXX_COMPILER=clang++-18 \
                -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
                -DMABOROUTU_ENABLE_EXTENSION=ON \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
              cmake --build build

         - name: Run clang-tidy
           run: |
              status=0
              for f in core/src/*.cppm extension/src/*.cppm; do
                clang-tidy-18 -p build --config-file=.github/clang-tidy-ci.yml \
                  --quiet "$f" || status=1
              done
              exit "$status"

   # 利用例（examples/）のビルドと実行。READMEに載せる例が、現在のAPIで
   # ビルド・動作することの検証（陳腐化の検知）。
   examples:
      runs-on: ubuntu-24.04
      steps:
         - uses: actions/checkout@v4

         - name: Install Clang 18 + libc++ + Ninja
           run: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                clang-18 libc++-18-dev libc++abi-18-dev ninja-build

         - name: Configure and build examples
           run: |
              cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang-18 \
                -DCMAKE_CXX_COMPILER=clang++-18 \
                -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
                -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ \
                -DMABOROUTU_BUILD_EXAMPLES=ON
              cmake --build build

         - name: Run examples
           run: |
              for e in binary_roundtrip length_prefixed_patch error_handling; do
                ./build/examples/"$e"
              done
